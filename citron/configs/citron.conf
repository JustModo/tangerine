# citron configuration.
#
# Sized for the 2 vCPU / 8 GB baseline. Scaling up is a change to [scheduler] and
# [limits.submission] only — no code changes (DESIGN.md §44).

[server]
# This service executes untrusted code. Bind it to a private interface and let the
# reverse proxy or the container network be the only way in.
address = "127.0.0.1:2358"
read_timeout_seconds = 30
write_timeout_seconds = 60
shutdown_grace_seconds = 20
# When set, requests must carry X-Judge-Token. Empty means no authentication.
auth_token = ""

[sandbox]
# "nsjail" isolates untrusted code. "local" does NOT — development only, and it
# additionally requires allow_unsafe_local = true.
driver = "nsjail"
allow_unsafe_local = false
nsjail_path = "/usr/local/bin/nsjail"
cgroup_root = "/sys/fs/cgroup/citron"
workspace_root = "/box"
cache_root = "/box/cache"
cache_entries = 256
# The filesystem a submission sees. A language whose runtime needs another path is a
# change here, not a rebuild.
readonly_paths = ["/usr", "/etc/alternatives", "/etc/java-21-openjdk"]
symlinks = ["/usr/bin:/bin", "/usr/lib:/lib", "/usr/lib64:/lib64", "/usr/sbin:/sbin"]
# Bounds writable scratch space. Nothing else stops a submission writing files until
# the host's disk is full.
tmpfs_mb = 64

[limits.execution]
cpu_time_seconds = 2
cpu_extra_time_seconds = 0.5
wall_time_seconds = 4
memory_mb = 256
stack_mb = 64
max_processes = 32
max_file_mb = 16
stdout_mb = 1
stderr_mb = 1

[limits.compile]
wall_time_seconds = 15
cpu_time_seconds = 12
memory_mb = 512
max_processes = 64
max_file_mb = 64
output_kb = 64

[limits.submission]
max_testcases = 1000
max_source_mb = 1
max_total_input_mb = 32
max_total_output_mb = 32
max_parallel_testcases = 4
# Must stay below the client's own timeout so an overloaded citron still returns a
# structured result instead of the client aborting with nothing.
max_total_wall_time_seconds = 30

[scheduler]
max_concurrent_submissions = 2
# How long a submission may wait for a slot before citron refuses it with 503.
# Shedding load beats holding a connection the client will abandon anyway.
max_queue_wait_seconds = 15
execution_slots = 2
# Executions reserve memory from this budget before starting, so citron never
# depends on the OOM killer. Keep well below total RAM.
memory_budget_mb = 1024

[jobs]
max_attempts = 2

[queue]
# "inproc" runs the worker in this process — the default for a single machine.
# "redis" splits server and worker across processes.
driver = "inproc"
redis_url = ""
stream = "citron:submissions"
group = "citron"

[languages]
path = "configs/languages.toml"
require_toolchains = true

[log]
level = "info"
format = "json"
