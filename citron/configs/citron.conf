################################################################################
# Citron Configuration File
################################################################################
# Verbatim from API_DOCS.md §3, unmodified — Tangerine has no opinion on Citron's
# internals beyond the [server] address/auth_token it needs to reach it.

[server]
address = "0.0.0.0:2358"
read_timeout_seconds = 30
write_timeout_seconds = 60
shutdown_grace_seconds = 20
auth_token = ""


[sandbox]
driver = "nsjail"
allow_unsafe_local = false
nsjail_path = "/usr/local/bin/nsjail"
cgroup_root = "/sys/fs/cgroup/citron"
workspace_root = "/box"
cache_root = "/box/cache"
cache_entries = 256
readonly_paths = ["/usr", "/etc/alternatives", "/etc/java-21-openjdk"]
symlinks = ["/usr/bin:/bin", "/usr/lib:/lib", "/usr/lib64:/lib64", "/usr/sbin:/sbin"]
tmpfs_mb = 64


[limits.execution]
cpu_time_seconds = 2
cpu_extra_time_seconds = 0.5
wall_time_seconds = 4
memory_mb = 256
stack_mb = 64
max_processes = 32
max_file_mb = 16
stdout_mb = 1
stderr_mb = 1


[limits.compile]
wall_time_seconds = 15
cpu_time_seconds = 12
memory_mb = 512
max_processes = 64
max_file_mb = 64
output_kb = 64


[limits.submission]
max_testcases = 1000
max_source_mb = 1
max_total_input_mb = 32
max_total_output_mb = 32
max_parallel_testcases = 4
max_total_wall_time_seconds = 30


[scheduler]
max_concurrent_submissions = 2
max_queue_wait_seconds = 15
execution_slots = 2
memory_budget_mb = 1024


[jobs]
max_attempts = 2


[queue]
driver = "inproc"
redis_url = ""
stream = "citron:submissions"
group = "citron"


[languages]
path = "configs/languages.toml"
require_toolchains = true


[log]
level = "info"
format = "json"
