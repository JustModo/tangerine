services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/agent.db
      CITRON_URL: http://citron:2358
      GEMINI_API_KEY: ""
    volumes:
      - agent-data:/data
    networks:
      - public
      - judge
    depends_on:
      citron:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  citron:
    image: justmodo/citron:v1.0.0
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
    cgroup: private
    command: ["citron", "-config", "/opt/citron/configs/citron.conf", "-address", "0.0.0.0:2358"]
    networks:
      - judge
    tmpfs:
      - /box:size=2g,mode=1777,exec
    volumes:
      - ./citron/configs/citron.conf:/opt/citron/configs/citron.conf:ro
      - ./citron/configs/languages.toml:/opt/citron/configs/languages.toml:ro
    healthcheck:
      test: ["CMD", "citron", "-config", "/opt/citron/configs/citron.conf", "-languages"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  public:
  judge:
    internal: true

volumes:
  agent-data:
