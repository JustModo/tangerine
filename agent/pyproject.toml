[project]
name = "agent"
version = "0.1.0"
description = "Tangerine AI DSA learning agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "langgraph>=1.2.11",
    "google-genai>=2.19.0",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
# Matches what the codebase already writes (median 104): picked to describe the existing
# convention rather than to force a 93-line reflow the first time the linter runs.
line-length = 110

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, comprehensions.
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Prompt modules are one long string constant each; wrapping is dictated by the prose.
# Prompt text, either as a module constant or as a pydantic Field description the model reads.
"app/llm/prompts/*.py" = ["E501"]
"app/llm/schemas/*.py" = ["E501"]
# Depends()/Query() in a signature default is how FastAPI declares dependencies.
"app/*/api/*.py" = ["B008"]
"app/*/router.py" = ["B008"]
